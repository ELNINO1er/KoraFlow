# KoraFlow — services de développement local.
# Usage : docker compose up -d
# NB : ne contient AUCUN secret de production. Les identifiants ci-dessous
# sont réservés au développement local.
services:
  postgres:
    image: postgres:16-alpine
    container_name: koraflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: koraflow
      POSTGRES_PASSWORD: koraflow_dev_password
      POSTGRES_DB: koraflow
    ports:
      # Hôte 5433 -> conteneur 5432, pour éviter tout conflit avec un
      # PostgreSQL déjà installé localement. Ajuster côté hôte si besoin.
      - "5433:5432"
    volumes:
      - koraflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koraflow -d koraflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Serveur SMTP de développement : capture les e-mails sans rien envoyer.
  # Interface web : http://localhost:8025  ·  SMTP : localhost:1025
  mailpit:
    image: axllent/mailpit:latest
    container_name: koraflow_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  koraflow_pgdata:
    name: koraflow_pgdata
