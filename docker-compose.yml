# Alymero — services de développement local.
# Usage : docker compose up -d
# NB : ne contient AUCUN secret de production. Les identifiants ci-dessous
# sont réservés au développement local.
services:
  mariadb:
    image: mariadb:11.4
    container_name: koraflow_mariadb
    restart: unless-stopped
    environment:
      MARIADB_USER: koraflow
      MARIADB_PASSWORD: koraflow_dev_password
      MARIADB_DATABASE: koraflow
      MARIADB_ROOT_PASSWORD: koraflow_dev_root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      # Hôte 3307 -> conteneur 3306, pour éviter tout conflit avec le MySQL de WAMP.
      - "3307:3306"
    volumes:
      - koraflow_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: koraflow_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  koraflow_mariadb:
    name: koraflow_pgdata
