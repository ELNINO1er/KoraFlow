name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Typecheck · Tests · Build
    runs-on: ubuntu-latest

    # PostgreSQL de service : nécessaire aux tests d'intégration (isolation
    # multi-tenant) qui touchent la vraie base.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: koraflow
          POSTGRES_PASSWORD: koraflow_ci_password
          POSTGRES_DB: koraflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koraflow -d koraflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Connexion à la base de service (port CI = 5432).
      DATABASE_URL: postgresql://koraflow:koraflow_ci_password@localhost:5432/koraflow?schema=public
      # Valeurs factices, exclusivement pour la CI (aucun secret réel).
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0000000000
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      DEFAULT_LOCALE: fr
      DEFAULT_CURRENCY: XOF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (unit + integration)
        run: npm test

      - name: Build
        run: npm run build
