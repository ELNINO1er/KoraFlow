name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Typecheck · Tests · Build
    # Version figée pour éviter les migrations silencieuses de l'image latest.
    runs-on: ubuntu-24.04

    # MariaDB de service : nécessaire aux tests d'intégration (isolation
    # multi-tenant) qui touchent la vraie base.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_USER: alymero
          MARIADB_PASSWORD: alymero_ci_password
          MARIADB_DATABASE: alymero
          MARIADB_ROOT_PASSWORD: alymero_ci_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Connexion à la base de service (port CI = 3306).
      DATABASE_URL: mysql://alymero:alymero_ci_password@127.0.0.1:3306/alymero
      # Valeurs factices, exclusivement pour la CI (aucun secret réel).
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0000000000
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      DEFAULT_LOCALE: fr
      DEFAULT_CURRENCY: XOF

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (unit + integration)
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate production Compose file
        env:
          ALYMERO_ENV_FILE: .env.production.example
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Build production container
        run: docker build --target runner --tag alymero:ci .
