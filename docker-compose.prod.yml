services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_USER: ${MARIADB_USER:?MARIADB_USER requis}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD requis}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?MARIADB_DATABASE requis}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - alymero_prod_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    env_file: ${ALYMERO_ENV_FILE:-.env.production}
    depends_on:
      mariadb:
        condition: service_healthy
    networks: [backend]

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: ${ALYMERO_ENV_FILE:-.env.production}
    # IMPORTANT : ces valeurs ont PRIORITÉ sur env_file. Le déploiement Docker
    # mono-instance utilise DÉLIBÉRÉMENT un stockage local sur volume persistant
    # (alymero_prod_uploads). Toute variable S3_* présente dans .env.production
    # est donc IGNORÉE sur ce chemin Docker. Pour utiliser S3 (multi-instance,
    # Hostinger/Supabase), déployer SANS ce compose et sans cet override.
    environment:
      NODE_ENV: production
      STORAGE_DRIVER: local
      PRIVATE_UPLOAD_DIR: /app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - alymero_prod_uploads:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"
    networks: [backend]

volumes:
  alymero_prod_db:
  alymero_prod_uploads:

networks:
  backend:
    internal: true
